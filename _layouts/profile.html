---
layout: default
---
{% include base_path %}
<div id="main" role="main">
  <article class="page">
    <div class="page__inner-wrap">
      <section id="main-content" class="page__content academic-page{% if page.home %} academic-home{% endif %}">
        {% unless page.home %}<h1 class="hero-title">{{ page.title | escape }}</h1>{% endunless %}
        {{ content }}
      </section>
    </div>
  </article>
</div>
