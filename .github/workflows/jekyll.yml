# Builds the Jekyll site, checks the output and deploys it to GitHub Pages
name: Build and deploy the site

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages-${{ github.event.pull_request.number || 'deployment' }}
  cancel-in-progress: false

jobs:
  # Build job
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'        
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Check portfolio output
        run: |
          for page in index.html research/index.html publications/index.html software/index.html cv/index.html teaching/index.html blog/index.html notes/index.html rss.xml sitemap.xml sitemap-index.xml images/shafayet.webp; do
            test -s "_site/$page" || { echo "Missing $page"; exit 1; }
          done
          for section in news publications experience awards talks; do
            grep -Fq "id=\"$section\"" _site/index.html || { echo "Missing home section $section"; exit 1; }
          done
          test -s _site/bn/index.html && grep -Fq 'url=https://www.shafayetahmad.com/' _site/bn/index.html
          grep -Fq 'url=https://www.shafayetahmad.com/blog/' _site/notes/index.html
          grep -Fq '<loc>https://www.shafayetahmad.com/sitemap.xml</loc>' _site/sitemap-index.xml
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
